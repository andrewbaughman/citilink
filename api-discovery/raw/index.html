    <script type="text/javascript">

        $(document).ready(function() {

            $('#planner_when_date').datetimepicker({
                format: 'MM/DD/YYYY',
                minDate:new Date()
            });

            $('#planner_when_time').datetimepicker({
                format: 'LT',
            });

            $( "#trip_planner_form" ).validate({
                rules: {
                    saddr:{
                        required: true,
                        minlength: 2
                    },
                    daddr:{
                        required: true,
                        minlength: 2
                    }
                },
                messages: {
                    saddr:{
                        required: "This field is required.",
                        minlength: "Please Enter at least 2 characters"
                    },
                    daddr:{
                        required: "This field is required.",
                        minlength: "Please Enter at least 2 characters"
                    }
                },
                errorElement: "em",
                errorPlacement: function ( error, element ) {
                    // Add the `help-block` class to the error element
                    error.addClass( "help-block" );
                    error.insertAfter( element );
                },
                highlight: function ( element, errorClass, validClass ) {
                    $( element ).parents( ".col-sm-5" ).addClass( "has-error" ).removeClass( "has-success" );
                },
                unhighlight: function (element, errorClass, validClass) {
                    $( element ).parents( ".col-sm-5" ).addClass( "has-success" ).removeClass( "has-error" );
                },
                submitHandler: function(form) {
                    form.submit();
                }
            });

            const center = { lat: 41.0873677596161, lng: -85.14822698915015 };
           // Create a bounding box with sides ~50km away from the center point
            const defaultBounds = {
                north: center.lat + 0.5,
                south: center.lat - 0.5,
                east: center.lng + 0.5,
                west: center.lng - 0.5,
            };
            //Places Autocomplete
            var autocompleteOptions= {
                bounds: defaultBounds,
                componentRestrictions: { country: ["us"] },
                fields: [ "formatted_address"],
                strictBounds: true,
            };
            var saddrField=document.querySelector("#saddr");
            var daddrField=document.querySelector("#daddr");
            var saddrAutocomplete = new google.maps.places.Autocomplete(saddrField,autocompleteOptions);
            saddrAutocomplete.addListener("place_changed", fillSaddrField);
            var daddrAutocomplete = new google.maps.places.Autocomplete(daddrField,autocompleteOptions);
            daddrAutocomplete.addListener("place_changed", fillDaddrField);

            function fillSaddrField() {
                saddrField.value=saddrAutocomplete.getPlace().formatted_address;
            }

            function fillDaddrField() {
                daddrField.value=daddrAutocomplete.getPlace().formatted_address;
            }
        });
    </script>

        function createMap(center) {

            var optionsLayer = {};
            var options = {
                preferCanvas: true,
                center : center,
                closePopupOnClick : false,
            
                    zoom : 10,
                    layers : L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', L.Util.extend(optionsLayer, {
                    minZoom : 2,
                    maxZoom : 19,
                    attribution : '<a target="_blank" rel="noreferrer" href="https://www.openstreetmap.org">© OpenStreetMap</a>'
                })),
                
            limitationDeplacement : true,
                // On désactive l'attribution/zoom par défaut (pour la gestion des traductions)
                attributionControl : false,
                zoomControl : false,
                // Plugin(s)
                almostOver: true,
                almostHover: false
        };

            var mapResult = L.map('map', options);

            // Gestion des traductions
            // - zoom
            mapResult.addControl(L.control.zoom({
                zoomInTitle: traduction.zoomIn,
                zoomOutTitle: traduction.zoomOut
            }));
            // - tooltip du lien Leaflet
            mapResult.addControl(L.control.attribution({
                prefix: '<a href="http://leafletjs.com">Leaflet</a>'
            }));

            return mapResult;
        }

        $( window ).load( preload([
            urls.resources + '/images/update.png',
            urls.resources + '/images/update_gris.png',
            urls.resources + '/images/fleche_precedent_gris.png',
            urls.resources + '/images/fleche_precedent.png',
            urls.resources + '/images/fleche_suivant_gris.png',
            urls.resources + '/images/fleche_suivant.png'
        ]) );

        $(document).ready(function() {
             // creation de la carte (centrage sur les coordonnées Lat Long obtenues à partir des params XCentre et YCentre)
            gMap = createMap(L.latLng(41.0873677596161, -85.14822698915015));
        });

    </script>
