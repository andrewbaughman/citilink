name: Collector health
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  health:
    if: vars.COLLECTOR_URL != ''
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/monitor.mjs
        env:
          COLLECTOR_URL: ${{ vars.COLLECTOR_URL }}
          HEALTH_TOKEN: ${{ secrets.HEALTH_TOKEN }}
