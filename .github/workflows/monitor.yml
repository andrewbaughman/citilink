name: Collector health
run-name: ${{ github.event_name == 'workflow_dispatch' && inputs.test_alert && 'Collector notification test' || 'Collector health' }}
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      test_alert:
        description: Intentionally fail this check to test notifications; collection keeps running
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/monitor.mjs
        env:
          COLLECTOR_URL: ${{ vars.COLLECTOR_URL || 'https://citilink-history.empty-mouse-f437.workers.dev' }}
          HEALTH_TOKEN: ${{ secrets.HEALTH_TOKEN }}
          MONITOR_TEST_ALERT: ${{ github.event_name == 'workflow_dispatch' && inputs.test_alert }}
