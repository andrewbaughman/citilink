name: Deploy collector
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: citilink-production-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run deploy
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          STATUS_TOKEN: ${{ secrets.STATUS_TOKEN }}
          HEALTH_TOKEN: ${{ secrets.HEALTH_TOKEN }}
